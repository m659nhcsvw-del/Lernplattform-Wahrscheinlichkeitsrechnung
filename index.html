<style>
body{margin:0;}

  :root{
    --nv-bg:#FBFAF6;
    --nv-surface:#FFFFFF;
    --nv-surface-2:#F3F0E7;
    --nv-surface-3:#EAE5D8;
    --nv-border:#E1DACB;
    --nv-text:#211F1B;
    --nv-text-muted:#6B6459;
    --nv-accent:#2F5D8A;
    --nv-accent-strong:#1F4568;
    --nv-accent-soft:#DCE7F0;
    --nv-amber:#B5762A;
    --nv-amber-soft:#F3E3CC;
    --afb1:#3E7D5C; --afb1-soft:#DCEDE3;
    --afb2:#B5822A; --afb2-soft:#F3E7CC;
    --afb3:#A2453A; --afb3-soft:#F4DEDA;
    --theme-transport:#2F6F8A; --theme-transport-soft:#DBEAF0;
    --theme-maschine:#565B66; --theme-maschine-soft:#E3E4E8;
    --theme-bio:#4C7A3A; --theme-bio-soft:#E1EBD9;
    --theme-physik:#5B4E9E; --theme-physik-soft:#E5E1F4;
    --theme-chemie:#3E8A81; --theme-chemie-soft:#DBEEEB;
    --theme-wirtschaft:#A6832A; --theme-wirtschaft-soft:#F2E7CC;
    --hl-given:#CFE3F2; --hl-given-text:#123A5C;
    --hl-target:#D8EBD3; --hl-target-text:#1F4A19;
    --hl-condition:#E6DCF2; --hl-condition-text:#3E2A63;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --nv-bg:#14171B; --nv-surface:#1B1F24; --nv-surface-2:#20252B; --nv-surface-3:#282E36;
      --nv-border:#333A43; --nv-text:#EBE8E0; --nv-text-muted:#9C978B;
      --nv-accent:#7CA9D8; --nv-accent-strong:#9CC0E8; --nv-accent-soft:#233246;
      --nv-amber:#E3A458; --nv-amber-soft:#3A2E1C;
      --afb1:#6FBF95; --afb1-soft:#1E2E25;
      --afb2:#E0B25F; --afb2-soft:#332A18;
      --afb3:#E08678; --afb3-soft:#3A2320;
      --theme-transport:#6FB0D6; --theme-transport-soft:#1C2C36;
      --theme-maschine:#AEB4C0; --theme-maschine-soft:#282A30;
      --theme-bio:#8FC178; --theme-bio-soft:#213222;
      --theme-physik:#A79AE0; --theme-physik-soft:#28243D;
      --theme-chemie:#6FC7BC; --theme-chemie-soft:#1C302C;
      --theme-wirtschaft:#E0BD6F; --theme-wirtschaft-soft:#332B18;
      --hl-given:#20344a; --hl-given-text:#B7D6F2;
      --hl-target:#203320; --hl-target-text:#BEE3B4;
      --hl-condition:#2c2140; --hl-condition-text:#D9C8F2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --nv-bg:#14171B; --nv-surface:#1B1F24; --nv-surface-2:#20252B; --nv-surface-3:#282E36;
    --nv-border:#333A43; --nv-text:#EBE8E0; --nv-text-muted:#9C978B;
    --nv-accent:#7CA9D8; --nv-accent-strong:#9CC0E8; --nv-accent-soft:#233246;
    --nv-amber:#E3A458; --nv-amber-soft:#3A2E1C;
    --afb1:#6FBF95; --afb1-soft:#1E2E25;
    --afb2:#E0B25F; --afb2-soft:#332A18;
    --afb3:#E08678; --afb3-soft:#3A2320;
    --theme-transport:#6FB0D6; --theme-transport-soft:#1C2C36;
    --theme-maschine:#AEB4C0; --theme-maschine-soft:#282A30;
    --theme-bio:#8FC178; --theme-bio-soft:#213222;
    --theme-physik:#A79AE0; --theme-physik-soft:#28243d;
    --theme-chemie:#6FC7BC; --theme-chemie-soft:#1C302C;
    --theme-wirtschaft:#E0BD6F; --theme-wirtschaft-soft:#332B18;
    --hl-given:#20344a; --hl-given-text:#B7D6F2;
    --hl-target:#203320; --hl-target-text:#BEE3B4;
    --hl-condition:#2c2140; --hl-condition-text:#D9C8F2;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--nv-bg); color:var(--nv-text);
    font-family:"Public Sans", system-ui, sans-serif;
    line-height:1.6; padding-inline:0;
  }
  h1,h2,h3,h4{font-family:"Fraunces", Georgia, serif; text-wrap:balance; color:var(--nv-text); margin:0;}
  p{margin:0 0 .8em 0; max-width:72ch;}
  code, .mono{font-family:"IBM Plex Mono", monospace;}
  a{color:var(--nv-accent-strong);}

  .nv-app{max-width:960px; margin:0 auto; padding-inline:16px;}

  .nv-stickybar{
    position:sticky; top:env(safe-area-inset-top,0px); background:var(--nv-bg); z-index:30;
  }
  header.nv-header{
    padding-block:22px 14px;
    border-bottom:1px solid var(--nv-border);
    transition:padding-block .15s ease;
  }
  header.nv-header[data-collapsed="true"]{ padding-block:10px; }
  .nv-header-inner{
    max-width:960px; margin:0 auto; padding-inline:16px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  }
  .nv-header-text{min-width:0; flex:1 1 auto;}
  .nv-eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--nv-accent); margin-bottom:4px;}
  .nv-title{font-size:clamp(1.4rem,3.2vw,2rem); font-weight:700; transition:font-size .15s ease;}
  header.nv-header[data-collapsed="true"] .nv-title{font-size:1.05rem;}
  .nv-subtitle{color:var(--nv-text-muted); font-size:.92rem; margin-top:4px; max-width:70ch;}
  header.nv-header[data-collapsed="true"] .nv-eyebrow,
  header.nv-header[data-collapsed="true"] .nv-subtitle{display:none;}

  .nv-header-menu{flex:0 0 auto; position:relative; margin-top:2px;}
  .nv-header-toggle{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--nv-border); background:var(--nv-surface);
    color:var(--nv-text-muted); font:inherit; font-size:.76rem; font-weight:600;
    padding:6px 11px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .nv-header-toggle:hover{background:var(--nv-surface-2); color:var(--nv-text);}
  .nv-header-toggle:focus-visible{outline:2px solid var(--nv-accent); outline-offset:1px;}
  .nv-header-toggle-icon{display:inline-block; transition:transform .15s ease;}
  .nv-header-toggle[aria-expanded="true"] .nv-header-toggle-icon{transform:rotate(180deg);}

  .nv-menu{
    position:absolute; top:calc(100% + 6px); right:0; z-index:40;
    background:var(--nv-surface); border:1px solid var(--nv-border); border-radius:12px;
    box-shadow:0 10px 28px rgba(0,0,0,.16); padding:6px; min-width:190px;
    display:flex; flex-direction:column; gap:1px;
  }
  .nv-menu[hidden]{display:none;}
  .nv-menu-item{
    text-align:left; border:none; background:transparent; width:100%;
    padding:8px 10px; border-radius:8px; font:inherit; font-size:.86rem;
    color:var(--nv-text); cursor:pointer;
  }
  .nv-menu-item:hover{background:var(--nv-surface-2);}
  .nv-menu-item[aria-current="true"]{color:var(--nv-accent-strong); font-weight:700;}
  .nv-menu-sep{height:1px; background:var(--nv-border); margin:5px 4px;}
  @media (max-width:480px){
    .nv-header-toggle-label{display:none;}
  }

  nav.nv-tabs{
    display:flex; gap:6px; overflow-x:auto; padding:10px 16px 0 16px;
    border-bottom:1px solid var(--nv-border); background:var(--nv-bg);
    scrollbar-width:thin;
  }
  .nv-tab-btn{
    flex:0 0 auto; border:1px solid transparent; border-bottom:none;
    background:transparent; color:var(--nv-text-muted); font:inherit; font-weight:600;
    font-size:.86rem; padding:9px 14px; border-radius:10px 10px 0 0; cursor:pointer;
    white-space:nowrap;
  }
  .nv-tab-btn:hover{color:var(--nv-text); background:var(--nv-surface-2);}
  .nv-tab-btn[aria-selected="true"]{
    color:var(--nv-accent-strong); background:var(--nv-surface);
    border-color:var(--nv-border); border-bottom:1px solid var(--nv-surface);
    transform:translateY(1px);
  }

  main.nv-app{padding-block:26px 60px;}
  .nv-panel{display:none;}
  .nv-panel[data-active="true"]{display:block;}

  .nv-lede{
    background:var(--nv-surface-2); border:1px solid var(--nv-border); border-radius:14px;
    padding:16px 18px; margin-bottom:22px; font-size:.95rem; color:var(--nv-text-muted);
  }
  .nv-lede b{color:var(--nv-text);}

  /* Collapsible sections */
  .nv-section{border:1px solid var(--nv-border); border-radius:12px; margin-bottom:12px; background:var(--nv-surface); overflow:hidden;}
  .nv-section-toggle{
    width:100%; display:flex; align-items:center; gap:10px; text-align:left;
    background:var(--nv-surface-2); border:none; cursor:pointer; padding:12px 16px;
    font:inherit; font-weight:600; color:var(--nv-text); font-size:.98rem;
  }
  .nv-section-toggle:hover{background:var(--nv-surface-3);}
  .nv-section-toggle:focus-visible{outline:2px solid var(--nv-accent); outline-offset:-2px;}
  .nv-chevron{display:inline-block; transition:transform .15s ease; color:var(--nv-accent); flex:0 0 auto;}
  .nv-section-toggle[aria-expanded="true"] .nv-chevron{transform:rotate(90deg);}
  .nv-section-body{padding:16px 18px 6px 18px;}
  .nv-section-body[hidden]{display:none;}

  /* Task cards */
  .nv-task{border:1px solid var(--nv-border); border-radius:16px; margin-bottom:22px; background:var(--nv-surface); overflow:hidden;}
  .nv-task-head{padding:14px 18px; background:var(--nv-surface-2); display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px; border-bottom:1px solid var(--nv-border);}
  .nv-task-num{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--nv-text-muted); font-size:.85rem;}
  .nv-task-title{font-family:"Fraunces",serif; font-weight:600; font-size:1.05rem; flex:1 1 240px;}
  .nv-badge{font-size:.72rem; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em;}
  .nv-task-body{padding:14px 18px 8px;}

  .badge-afb1{background:var(--afb1-soft); color:var(--afb1);}
  .badge-afb2{background:var(--afb2-soft); color:var(--afb2);}
  .badge-afb3{background:var(--afb3-soft); color:var(--afb3);}
  .badge-transport{background:var(--theme-transport-soft); color:var(--theme-transport);}
  .badge-maschine{background:var(--theme-maschine-soft); color:var(--theme-maschine);}
  .badge-bio{background:var(--theme-bio-soft); color:var(--theme-bio);}
  .badge-physik{background:var(--theme-physik-soft); color:var(--theme-physik);}
  .badge-chemie{background:var(--theme-chemie-soft); color:var(--theme-chemie);}
  .badge-wirtschaft{background:var(--theme-wirtschaft-soft); color:var(--theme-wirtschaft);}

  .hl-given{background:var(--hl-given); color:var(--hl-given-text); padding:.05em .3em; border-radius:4px;}
  .hl-target{background:var(--hl-target); color:var(--hl-target-text); padding:.05em .3em; border-radius:4px;}
  .hl-condition{background:var(--hl-condition); color:var(--hl-condition-text); padding:.05em .3em; border-radius:4px;}
  .nv-legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:.82rem; color:var(--nv-text-muted); margin-bottom:12px;}
  .nv-legend span.swatch{display:inline-block; width:.8em; height:.8em; border-radius:3px; margin-right:5px; vertical-align:-1px;}

  table.nv-table{border-collapse:collapse; width:100%; margin:.6em 0 1em; font-size:.92rem;}
  table.nv-table th, table.nv-table td{border:1px solid var(--nv-border); padding:7px 10px; text-align:left; vertical-align:top;}
  table.nv-table th{background:var(--nv-surface-2); font-family:"Fraunces",serif;}
  .nv-table-wrap{overflow-x:auto; margin-bottom:1em;}

  .nv-chart{margin:12px 0; background:var(--nv-surface-2); border:1px solid var(--nv-border); border-radius:12px; padding:10px 8px 4px;}
  .nv-axis{stroke:var(--nv-text-muted); stroke-width:1;}
  .nv-curve{fill:none; stroke:var(--nv-accent-strong); stroke-width:2.4;}
  .nv-curve-1{stroke:var(--afb3);} .nv-curve-2{stroke:var(--afb1);} .nv-curve-3{stroke:var(--afb2);}
  .nv-figure{margin:14px 0;} .nv-figure figcaption{font-size:.84rem; color:var(--nv-text-muted); margin-top:4px;}
  .nv-def{border-left:4px solid var(--nv-accent); background:var(--nv-accent-soft); border-radius:0 10px 10px 0; padding:10px 14px; margin:12px 0;}
  .nv-def > :last-child{margin-bottom:0;}
  .nv-example{border:1px solid var(--nv-border); border-left:4px solid var(--nv-amber); background:var(--nv-amber-soft); border-radius:0 10px 10px 0; padding:10px 14px; margin:12px 0;}
  .nv-example > :last-child{margin-bottom:0;}
  .nv-summary{border:2px solid var(--nv-accent); border-radius:12px; padding:12px 16px; margin:14px 0; background:var(--nv-surface-2);}
  .nv-summary > :last-child{margin-bottom:0;}
  .nv-explorer input[type=range]{width:100%;}
  .nv-markline{stroke:var(--nv-text-muted); stroke-width:1.2;}
  .nv-ticklabel{font:11px "IBM Plex Mono", monospace; fill:var(--nv-text-muted);}
  .nv-marklabel{font:12px "IBM Plex Mono", monospace; fill:var(--nv-text-muted);}
  .nv-axislabel{font:12px "Public Sans", sans-serif; fill:var(--nv-text-muted);}
  .nv-bar{fill:var(--nv-accent-soft); stroke:var(--nv-accent); stroke-width:1;}
  .nv-bar-hi{fill:var(--nv-accent); stroke:var(--nv-accent-strong); stroke-width:1;}

  .nv-tool{border:1px dashed var(--nv-border); border-radius:12px; padding:14px; background:var(--nv-surface-2); margin:10px 0;}
  .nv-tool-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:6px;}
  .nv-field{display:flex; flex-direction:column; gap:3px; font-size:.8rem; color:var(--nv-text-muted); font-weight:600;}
  .nv-input{font:inherit; font-family:"IBM Plex Mono",monospace; padding:6px 8px; border:1px solid var(--nv-border); border-radius:7px; background:var(--nv-surface); color:var(--nv-text);}
  .nv-tool-result{font-weight:600; padding:8px 2px 2px; font-size:.94rem;}
  .nv-tool-sub{font-weight:400; color:var(--nv-text-muted); font-size:.85rem; margin-top:3px;}

  .nv-ti{background:var(--nv-surface-3); border-radius:10px; padding:10px 12px; font-family:"IBM Plex Mono",monospace; font-size:.85rem; margin:.5em 0; white-space:pre-wrap;}

  .nv-tasktools{display:flex; gap:8px; margin-left:auto;}
  .nv-tool-btn{border:1px solid var(--nv-border); background:var(--nv-surface); color:var(--nv-text-muted); font-size:.76rem; padding:4px 10px; border-radius:999px; cursor:pointer;}
  .nv-tool-btn:hover{background:var(--nv-surface-3); color:var(--nv-text);}

  .nv-compare-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin:12px 0;}
  .nv-compare-card{border:1px solid var(--nv-border); border-radius:12px; padding:12px 14px; background:var(--nv-surface-2);}
  .nv-compare-card h4{font-size:.95rem; margin-bottom:6px;}

  .nv-lernziel{padding:9px 18px; font-size:.86rem; color:var(--nv-text-muted); background:var(--nv-surface); border-bottom:1px solid var(--nv-border);}
  .nv-lernziel b{color:var(--nv-text);}
  ul.nv-check{list-style:none; padding:0; margin:.4em 0 1em;}
  ul.nv-check li{padding:3px 0 3px 1.7em; position:relative;}
  ul.nv-check li::before{content:"✓"; position:absolute; left:.2em; color:var(--afb1); font-weight:700;}
  ul.nv-check li.nein::before{content:"✗"; color:var(--afb3);}
  .nv-box{border:1px solid var(--nv-border); border-radius:10px; padding:9px 13px; margin:.9em 0; font-size:.92rem;}
  .nv-box.fehler{background:var(--afb3-soft); border-color:var(--afb3);}
  .nv-box.merke{background:var(--afb1-soft); border-color:var(--afb1);}
  .nv-box p{margin:0;}
  .nv-pfad{display:block; margin-top:.55em; font-size:.88rem;}
  ::selection{background:var(--nv-accent-soft);}

</style>
